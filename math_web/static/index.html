<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수학 시험지 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#d97706',   /* amber-600 */
            surface: '#fafaf9',
            border: '#e5e7eb',
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', 'ui-sans-serif', 'system-ui'],
            mono: ['"JetBrains Mono"', 'ui-monospace'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-surface text-gray-800 min-h-screen font-sans antialiased">

  <!-- 헤더 -->
  <header class="border-b border-border bg-white sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-6 h-14 flex items-center gap-6">
      <span class="font-semibold text-gray-900 tracking-tight">수학 시험지 생성기</span>
      <nav class="flex gap-4 text-sm text-gray-500">
        <a href="/static/index.html" class="text-accent font-medium">시험지 생성</a>
        <a href="/static/db.html" class="hover:text-gray-900">문제 검색</a>
        <a href="/static/admin.html" class="hover:text-gray-900">기출 입력</a>
      </nav>
      <a href="#" id="btn-download-pdf"
         class="hidden ml-auto px-4 py-1.5 rounded-lg bg-accent text-white text-sm font-medium
                hover:bg-amber-700 transition-colors">
        PDF 다운로드
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10 space-y-10">

    <!-- ① 이미지 업로드 -->
    <section>
      <h2 class="text-base font-semibold text-gray-700 mb-3">① 시험지 이미지 업로드</h2>
      <label id="drop-zone"
             class="flex flex-col items-center justify-center gap-3 border-2 border-dashed
                    border-border rounded-xl p-10 cursor-pointer hover:border-accent
                    hover:bg-amber-50 transition-colors">
        <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
        </svg>
        <span class="text-sm text-gray-500">이미지를 드래그하거나 클릭해서 선택</span>
        <span class="text-xs text-gray-400">JPG, PNG, WEBP · 최대 20MB</span>
        <input type="file" id="file-input" accept="image/*" class="hidden" />
      </label>
      <div id="preview-container" class="hidden mt-4 flex gap-3 flex-wrap"></div>
      <button id="btn-extract"
              class="hidden mt-4 px-5 py-2 rounded-lg bg-gray-900 text-white text-sm font-medium
                     hover:bg-gray-700 transition-colors disabled:opacity-40">
        문제 추출
      </button>
    </section>

    <!-- 스피너 -->
    <div id="spinner" class="hidden flex items-center gap-3 text-sm text-gray-500">
      <svg class="animate-spin w-5 h-5 text-accent" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
      </svg>
      <span id="spinner-text">처리 중...</span>
    </div>

    <!-- ② 문제 목록 -->
    <section id="problems-section" class="hidden">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-semibold text-gray-700">② 문제 확인 · 편집</h2>
        <button id="btn-add-problem"
                class="text-xs text-accent hover:underline">+ 문제 추가</button>
      </div>

      <!-- 시험지 메타 -->
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label class="block text-xs text-gray-500 mb-1">제목</label>
          <input id="exam-title" type="text" placeholder="예) 3학년 1학기 수학 시험"
                 class="w-full border border-border rounded-lg px-3 py-2 text-sm focus:outline-none
                        focus:ring-2 focus:ring-accent/40" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">부제 (선택)</label>
          <input id="exam-subtitle" type="text" placeholder="예) 선택형 16문항 / 서술형 8문항"
                 class="w-full border border-border rounded-lg px-3 py-2 text-sm focus:outline-none
                        focus:ring-2 focus:ring-accent/40" />
        </div>
      </div>

      <div id="problem-list" class="space-y-3"></div>

      <!-- 변형 + PDF 버튼 -->
      <div class="flex gap-3 mt-6">
        <button id="btn-variants-all"
                class="px-5 py-2 rounded-lg border border-border text-sm font-medium
                       hover:bg-gray-100 transition-colors">
          전체 변형 생성 (×3)
        </button>
        <button id="btn-pdf-preview"
                class="px-5 py-2 rounded-lg bg-gray-900 text-white text-sm font-medium
                       hover:bg-gray-700 transition-colors">
          시험지 PDF 생성
        </button>
        <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
          <input type="checkbox" id="chk-answers" class="accent-amber-600 w-4 h-4" />
          정답지 포함
        </label>
      </div>
    </section>

  </main>

  <!-- 문제 카드 템플릿 -->
  <template id="problem-card-tpl">
    <div class="problem-card border border-border rounded-xl bg-white p-5 space-y-3">
      <div class="flex items-start justify-between gap-3">
        <span class="prob-num text-sm font-semibold text-gray-500 mt-0.5 shrink-0"></span>
        <div class="flex-1 space-y-2">
          <!-- type + score -->
          <div class="flex gap-2">
            <select class="field-type border border-border rounded-md px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-accent/40">
              <option value="선택형">선택형</option>
              <option value="서술형">서술형</option>
            </select>
            <input class="field-score w-16 border border-border rounded-md px-2 py-1 text-xs
                          focus:outline-none focus:ring-2 focus:ring-accent/40"
                   type="number" min="1" max="20" placeholder="배점" />
          </div>
          <!-- 본문 -->
          <textarea class="field-text w-full border border-border rounded-lg px-3 py-2 text-sm
                           resize-none focus:outline-none focus:ring-2 focus:ring-accent/40"
                    rows="2" placeholder="문제 본문"></textarea>
          <!-- LaTeX -->
          <input class="field-latex w-full border border-border rounded-lg px-3 py-2 text-sm font-mono
                        focus:outline-none focus:ring-2 focus:ring-accent/40"
                 type="text" placeholder="수식 (LaTeX, 선택 사항)" />
          <!-- 보기 (선택형에만 표시) -->
          <div class="choices-block space-y-1">
            <div class="text-xs text-gray-400 mb-1">보기</div>
            <div class="grid grid-cols-1 gap-1 choices-list"></div>
          </div>
          <!-- 정답 -->
          <input class="field-answer w-full border border-border rounded-lg px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-accent/40"
                 type="text" placeholder="정답 (예: ②, x=√17)" />
        </div>
        <!-- 카드 액션 버튼 -->
        <div class="flex flex-col gap-1 shrink-0">
          <button class="btn-variant text-xs text-accent hover:underline whitespace-nowrap">변형</button>
          <button class="btn-delete text-xs text-gray-400 hover:text-red-500 transition-colors">삭제</button>
        </div>
      </div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
